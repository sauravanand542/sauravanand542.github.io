<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") theme = stored;
          else if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (error) {
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.classList.add("js");
      })();
    </script>
    <title>Page not found · Saurav Anand</title>
    <meta name="description" content="That page is not part of Saurav Anand’s portfolio.">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="/">Saurav Anand</a>
        <div class="header-tools">
          <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">
            <span class="theme-label">Dark theme</span>
          </button>
        </div>
      </div>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="missing-heading">
        <div class="wrap">
          <p class="kicker">404</p>
          <h1 id="missing-heading">Page not found</h1>
          <p class="hero-lead">That address is not part of this site.</p>
          <div class="actions">
            <a class="button" href="/">Back to the portfolio</a>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="wrap contact">
        <h2>Contact</h2>
        <p><a href="https://github.com/sauravanand542" rel="me">github.com/sauravanand542</a></p>
      </div>
    </footer>
    <script src="/main.js"></script>
  </body>
</html>
